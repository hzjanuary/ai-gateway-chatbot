[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "oss-inference-gateway"
version = "0.1.0"
description = "Single-instance, policy-bounded Cloudflare Workers AI and Ollama gateway"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.scripts]
gateway = "gateway.cli:main"

[project.optional-dependencies]
ui = [
    "streamlit==1.66.1",
]

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["E501", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607", "S104"]
"scripts/*" = ["S603", "S607"]
# Test runner uses Docker tmpfs and an isolated internal network with no host ports.
"scripts/release_smoke.py" = ["S104", "S108"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gateway"]

[dependency-groups]
dev = [
    "black==26.10.1",
    "build==1.6.1",
    "cyclonedx-bom==7.5.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
]
