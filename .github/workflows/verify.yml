name: Verify source and image independently
on:
  pull_request:
  push:
    branches: [main, feat/spec-001-oss-inference-gateway]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.6.5'
      - run: uv sync --locked --extra ui --python '${{ matrix.python }}'
      - run: mkdir -p .local/verification
      - run: ./scripts/quality.sh
      - name: Python advisory gates (all severities)
        run: |
          uv run python -m pip_audit --require-hashes --no-deps --disable-pip -r requirements.txt --format json --output .local/verification/python-headless.json
          uv run python -m pip_audit --require-hashes --no-deps --disable-pip -r requirements-ui.txt --format json --output .local/verification/python-ui.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: source-evidence-${{ matrix.python }}
          path: .local/verification/
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [headless, ui]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.6.5'
      - run: uv sync --locked --extra ui
      - name: Clean committed archive and actual image runtime
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = ui ]; then ui_flag=--ui; else ui_flag=; fi
          uv run python scripts/release_smoke.py --build --quality $ui_flag --image gateway-ci:$VARIANT
      - name: Image vulnerabilities, secrets, licenses, SBOM and provenance
        env:
          VARIANT: ${{ matrix.variant }}
        run: uv run python scripts/security_gates.py --image gateway-ci:$VARIANT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: image-evidence-${{ matrix.variant }}
          path: |
            .local/verification/*.json
            .local/verification/*.xml
            .local/verification/*.txt
            .local/verification/source-*.tar
