name: inference-gateway
services:
  backend:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-uncommitted}
    image: inference-gateway:local
    command: ["serve", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8000:8000"
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    volumes:
      - type: bind
        source: ${GATEWAY_PRIVATE_DIR:-./.local/private}
        target: /var/lib/gateway
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  chat-ui:
    profiles: [ui]
    build:
      context: .
      args:
        INSTALL_UI: "true"
        SOURCE_REVISION: ${SOURCE_REVISION:-uncommitted}
    image: inference-gateway:ui-local
    command: ["ui", "chat", "--host", "0.0.0.0"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      BACKEND_URL: http://backend:8000
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).close()"]
    depends_on: [backend]

  admin-ui:
    profiles: [admin]
    build:
      context: .
      args:
        INSTALL_UI: "true"
        SOURCE_REVISION: ${SOURCE_REVISION:-uncommitted}
    image: inference-gateway:ui-local
    command: ["ui", "admin", "--host", "0.0.0.0"]
    ports: ["127.0.0.1:8502:8502"]
    environment:
      BACKEND_URL: http://backend:8000
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    pids_limit: 128
    mem_limit: 1g
    volumes:
      # Only hashes for UI login, never provider credentials or raw role tokens.
      - type: bind
        source: ${GATEWAY_ADMIN_UI_DIR:-./.local/admin-ui}
        target: /var/lib/gateway
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=2).close()"]
    depends_on: [backend]
